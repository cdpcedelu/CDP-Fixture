<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a5fa8">
<title>Página no encontrada — Torneo CDP</title>
<link rel="icon" type="image/png" href="/escudos/logo_1.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0a3d7a 0%, #1a5fa8 50%, #2563b8 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }
  .card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 24px;
    padding: 48px 32px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .code {
    font-size: 72px;
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 16px;
    opacity: 0.9;
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 16px;
    line-height: 1.1;
  }
  .msg {
    font-size: 17px;
    line-height: 1.6;
    opacity: 0.85;
    margin-bottom: 28px;
  }
  .btn {
    display: inline-block;
    background: white;
    color: #1a5fa8;
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 999px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    transition: transform 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid rgba(255,255,255,0.6); outline-offset: 3px; }
  .footer {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.15);
    font-size: 13px;
    opacity: 0.6;
    letter-spacing: 0.3px;
  }
  @media (max-width: 480px) {
    .card { padding: 36px 24px; }
    .code { font-size: 60px; }
    h1 { font-size: 24px; }
    .msg { font-size: 16px; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="code" aria-hidden="true">404</div>
    <h1>Página no encontrada</h1>
    <p class="msg">La página que buscás no existe o fue movida.</p>
    <a class="btn" href="/">Volver al inicio</a>
    <div class="footer">Club de Profesionales Justo José de Urquiza</div>
  </main>
</body>
</html>
