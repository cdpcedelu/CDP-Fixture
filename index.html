<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torneo CDP — En mantenimiento</title>
<script>
  // Si tiene el param admin, va a la app completa
  (function() {
    var params = new URLSearchParams(location.search);
    if (params.get('admin') === 'cdp1979') {
      location.replace('/app.html');
      return;
    }
    // Limpiar service worker viejo y caches para que PWAs instaladas vean este cartel
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      }).catch(function(){});
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        names.forEach(function(n) { caches.delete(n); });
      }).catch(function(){});
    }
  })();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0a3d7a 0%, #1a5fa8 50%, #2563b8 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }
  .card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 24px;
    padding: 48px 32px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .icon {
    font-size: 72px;
    margin-bottom: 20px;
    display: block;
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 24px;
    line-height: 1.1;
  }
  .msg {
    font-size: 18px;
    line-height: 1.6;
    opacity: 0.95;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .msg-sub {
    font-size: 16px;
    opacity: 0.75;
    margin-top: 4px;
  }
  .footer {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.15);
    font-size: 13px;
    opacity: 0.6;
    letter-spacing: 0.3px;
  }
  @media (max-width: 480px) {
    .card { padding: 36px 24px; }
    h1 { font-size: 26px; }
    .msg { font-size: 16px; }
    .icon { font-size: 60px; }
  }
</style>
</head>
<body>
  <div class="card">
    <span class="icon">🚧</span>
    <h1>Torneo CDP</h1>
    <div class="msg">Estamos haciendo mejoras.</div>
    <div class="msg-sub">Volvemos pronto.</div>
    <div class="footer">Club de Profesionales Justo José de Urquiza</div>
  </div>
</body>
</html>
